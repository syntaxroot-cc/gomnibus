name: openssl
default_version: "3.3.0"
license: OpenSSL

source:
  url: "https://www.openssl.org/source/openssl-3.3.0.tar.gz"
  sha256: "53e66b043322a606abf0087e7699a0e033a37fa13feb9742df35c3a33b18fb02"

relative_path: "openssl-3.3.0"

versions:
  - version: "3.3.1"
    source:
      url: "https://www.openssl.org/source/openssl-3.3.1.tar.gz"
      sha256: "777cd596284c883375a2a7a11bf5d2786fc5413255efab20c50d6ffe6d020b7e"

dependencies:
